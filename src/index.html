<meta charset="utf-8">
<title>GEM LO Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
{{ styles.css }}
</style>

<div class="app">
  <nav class="rail" aria-label="Weeks">
    <div class="rail-head">
      <div class="brand"><h1>LO Revision</h1><span>Swansea GEM</span><button class="homebtn" id="go-home" aria-pressed="false" title="Home dashboard" aria-label="Home dashboard"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5z"/></svg></button></div>
      <button class="overall" id="open-progress" aria-pressed="false" title="See all your progress"><span class="ov-label">Overall progress<small>details</small></span><span data-prog="total" data-pk="pct"></span><span data-prog="total" data-pk="bar"></span></button>
      <button class="mastered-link" id="go-mastered" aria-pressed="false" title="See everything you've mastered"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg><span>Mastered</span><b id="mcount"></b><svg class="mchev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      <div class="years" role="group" aria-label="Year">
        <button id="yr-y1" data-year="y1" aria-pressed="false"><b>Year 1</b><small data-prog="y1" data-pk="pct"></small><span data-prog="y1" data-pk="bar"></span></button>
        <button id="yr-y2" data-year="y2" aria-pressed="false"><b>Year 2</b><small data-prog="y2" data-pk="pct"></small><span data-prog="y2" data-pk="bar"></span></button>
        <button id="yr-anat" data-year="anat" aria-pressed="false"><b>Anatomy</b><small data-prog="anat" data-pk="pct"></small><span data-prog="anat" data-pk="bar"></span></button>
        <button id="yr-icm" data-year="icm" aria-pressed="false"><b>ICM</b><small data-prog="icm" data-pk="pct"></small><span data-prog="icm" data-pk="bar"></span></button>
        <button id="yr-drugs" data-year="drugs" aria-pressed="false"><b>Drugs</b><small data-prog="drugs" data-pk="pct"></small><span data-prog="drugs" data-pk="bar"></span></button>
        <button id="yr-quiz" data-year="quiz" aria-pressed="false"><b>Quiz</b><small data-prog="quiz" data-pk="pct"></small><span data-prog="quiz" data-pk="bar"></span></button>
      </div>
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <input id="q" type="search" placeholder="Search LOs and drugs (e.g. Virchow, warfarin)" autocomplete="off" aria-label="Search all learning outcomes">
      </label>
    </div>
    <ul class="weeks" id="weeks" role="tablist" aria-label="Learning weeks"></ul>
  </nav>
  <main class="main" id="main"><div class="main-inner" id="view"></div></main>
</div>

<nav class="histnav" id="histnav" aria-label="Back and forward" hidden>
  <button id="nav-back" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Back</span></button>
  <button id="nav-fwd" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
</nav>

<script id="lo-data" type="application/json">{{ content }}</script>
<script>
{{ app.js }}
</script>
